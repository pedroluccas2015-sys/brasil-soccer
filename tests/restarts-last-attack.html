<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reposições e último ataque — validação</title><style>body{margin:0;background:#0b1724;color:#edf3d6;font:14px Arial}nav{display:flex;gap:6px;padding:10px;flex-wrap:wrap}button{padding:9px;background:#213c50;color:inherit;border:1px solid #89a4a0;cursor:pointer}output{display:block;padding:8px 12px;color:#cbf37a;font:13px monospace}iframe{display:block;width:100%;height:calc(100dvh - 170px);border:0}</style><nav><button id="throw">Lateral</button><button id="defensive">Falta defensiva</button><button id="start">Iniciar cobrança</button><button id="step">Avançar 0,1 s</button><button id="contact">Soltar a bola</button><button id="duel">Disputa no escanteio</button><button id="clear">Afastar sem carrinho</button><button id="slide">Dar carrinho</button><button id="half">Apito do intervalo</button><button id="final">Apito final</button><button id="attack">Último ataque</button><button id="return">Voltar ao próprio campo</button><button id="out">Bola para fora</button><button id="goal">Gol no último ataque</button><button id="side">Trocar lado</button></nav><output id="status">Carregando…</output><iframe id="frame" src="../index.html" title="Jogo em validação"></iframe><script>
const frame=document.getElementById('frame'),status=document.getElementById('status');let s,side=0;const input={axis:{x:0,y:0},state:{},pressed:{},released:{}};frame.onload=()=>status.textContent='Pronto. Escolha um cenário.';
function report(){if(!s)return;const {m}=s;status.textContent=JSON.stringify({estado:m.state,cena:m.cinema?.active?.type,animacao:s.p?.anim,bola:{z:+m.ball.z.toFixed(1),velocidade:+Math.hypot(m.ball.vx,m.ball.vy).toFixed(1)},ultimoAtaque:m.periodExtension?.team,placar:m.teams.map(t=>t.score),faltas:m.teams.map(t=>t.stats.fouls),penalti:m.state==='penalty',reposicao:!!m.restartMotion});}
function setup(cutscenes=false){const B=frame.contentWindow.BSS,a=B.app;a.start('flamengo','palmeiras',{mode:'quick',human:side,seed:73,cutscenes});a.paused=true;const m=a.match;if(m.cinema)m.cinema.queue=[];m.bannerTime=0;s={B,a,m};return s;}
function focus(p){const {a}=s;a.renderer.camera.x=p.x;a.renderer.camera.y=p.y;}
document.getElementById('throw').onclick=()=>{const {B,m}=setup();m.setRestart('LATERAL',side,B.FIELD.cx,5);m.timer=0;s.p=m.restart.taker;const q=m.teams[side].players[8];q.x=B.FIELD.cx+140*m.teams[side].dir;q.y=120;q.vx=q.vy=0;s.receiver=q;focus(s.p);report();};
document.getElementById('defensive').onclick=()=>{const {B,m}=setup();m.setRestart('FALTA',side,B.FIELD.cx-m.teams[side].dir*220,B.FIELD.cy);m.timer=0;s.p=m.restart.taker;focus(s.p);report();};
document.getElementById('start').onclick=()=>{if(!s?.m.restart)return;const {m}=s;m.pass(m.restart.taker,'pass',.6,{x:m.teams[side].dir,y:m.restart.type==='LATERAL'?1:0},s.receiver);report();};
document.getElementById('step').onclick=()=>{if(!s)return;for(let i=0;i<12;i++)s.m.update(1/120,input);report();};
document.getElementById('contact').onclick=()=>{if(!s)return;for(let i=0;i<120&&s.m.state==='restart';i++)s.m.update(1/120,input);report();};
document.getElementById('duel').onclick=()=>{const {B,m}=setup(),t=m.teams[1-side],gx=t.dir>0?B.FIELD.w:0;m.setRestart('ESCANTEIO',1-side,gx-t.dir*6,6);m.freeKick.launch(m);m.freeKick=null;const p=m.teams[side].players[2],q=t.players[9];p.x=gx-t.dir*60;p.y=B.FIELD.cy;p.facing={x:p.team.dir,y:0};p.actionCooldown=0;q.x=p.x+t.dir*18;q.y=p.y;q.facing={x:t.dir,y:0};m.ball.reset(p.x+t.dir*16,p.y);m.ball.owner=q;m.ball.lastTouch=q;m.controlled=p;s.p=p;s.q=q;focus(p);report();};
document.getElementById('clear').onclick=()=>{if(!s)return;s.m.handleActions({axis:{x:0,y:0},state:{},pressed:{shoot:true},released:{}},.016);report();};
document.getElementById('slide').onclick=()=>{if(!s?.p)return;s.m.ball.reset(s.B.FIELD.cx,100);s.p.actionCooldown=0;s.m.tackle(s.p,true);report();};
function whistle(final){const {m}=setup(true);m.state='play';m.period=final?2:1;m.clock=final?5460:2760;m.teams[0].score=2;m.teams[1].score=1;m.endPeriod();m.update(1.1,input);report();}
document.getElementById('half').onclick=()=>whistle(false);document.getElementById('final').onclick=()=>whistle(true);
document.getElementById('attack').onclick=()=>{const {B,m}=setup();m.state='play';const p=m.teams[side].players[9];p.x=B.FIELD.cx+p.team.dir*190;p.y=B.FIELD.cy;m.ball.reset(p.x,p.y);m.ball.owner=p;m.ball.lastTouch=p;m.controlled=p;s.p=p;m.clock=2700+m.added;m.advanceClock(.01);focus(p);report();};
document.getElementById('return').onclick=()=>{if(!s?.m.periodExtension)return;const {B,m}=s;m.ball.owner=null;m.ball.x=B.FIELD.cx-m.periodExtension.dir;m.checkLastAttack();report();};
document.getElementById('out').onclick=()=>{if(!s?.m.periodExtension)return;s.m.ball.owner=null;s.m.ball.y=-2;s.m.boundaries();report();};
document.getElementById('goal').onclick=()=>{if(!s?.m.periodExtension)return;const {B,m}=s,dir=m.periodExtension.dir,gx=dir>0?B.FIELD.w:0;Object.assign(m.ball,{owner:null,px:gx-dir*3,x:gx+dir*3,py:B.FIELD.cy,y:B.FIELD.cy,pz:0,z:0});m.boundaries();m.completeGoal();report();};
document.getElementById('side').onclick=()=>{side=1-side;status.textContent='Equipe de teste: '+side+'. Selecione novamente um cenário.';};
</script></html>
