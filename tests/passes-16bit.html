<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Passes e atletas 16 bits — validação</title><style>body{margin:0;background:#0b1724;color:#edf3d6;font:14px Arial}nav{display:flex;gap:6px;padding:10px;flex-wrap:wrap}button{padding:9px;background:#213c50;color:inherit;border:1px solid #89a4a0;cursor:pointer}output{display:block;padding:8px 12px;color:#cbf37a}iframe{display:block;width:100%;height:calc(100dvh - 110px);border:0}canvas{display:none;max-width:100%;margin:auto;image-rendering:pixelated}body.atlas iframe{display:none}body.atlas canvas{display:block}</style>
<nav><button id="models">Atletas 16 bits</button><button data-pass="60">Passe curto</button><button data-pass="200">Passe de 20 m</button><button data-pass="moving">Passe em movimento</button><button id="step">Avançar 0,10 s</button><button id="corner">Escanteio</button><button id="free">Falta com área cheia</button><button id="launch">Cobrar</button><button id="cross">Cruzar falta</button></nav><output id="status">Carregando…</output><canvas id="atlas" width="1000" height="520"></canvas><iframe id="frame" src="../index.html" title="Jogo em verificação"></iframe><script>
const frame=document.getElementById('frame'),status=document.getElementById('status');let state;
frame.onload=()=>status.textContent='Pronto. Selecione um cenário.';
function setup(){const B=frame.contentWindow.BSS,a=B.app;a.start('flamengo','palmeiras',{mode:'quick',seed:2026,cutscenes:false});a.paused=true;a.match.state='play';a.match.bannerTime=0;document.body.classList.remove('atlas');return state={B,a,m:a.match,time:0};}
document.getElementById('models').onclick=()=>{const {B,a,m}=setup(),g=document.getElementById('atlas').getContext('2d');document.body.classList.add('atlas');g.imageSmoothingEnabled=false;g.fillStyle='#183c30';g.fillRect(0,0,1000,520);const poses=['idle','run','kick','celebrate'];for(let row=0;row<4;row++)for(let i=0;i<8;i++){const p=m.teams[row===3?1:0].players[row===2?0:8],sprite=a.renderer.sprite({...p,anim:poses[row],animTime:row===2?.18:0,runTime:2.4+i*.6,facing:{x:Math.cos(i*Math.PI/4),y:Math.sin(i*Math.PI/4)}}),x=i*125;g.drawImage(sprite,x+10,row*130+15,100,110);g.fillStyle='#eaf1ce';g.font='12px monospace';g.fillText(poses[row]+' '+(i+1),x+18,row*130+126);}status.textContent='Sprites originais com luz e sombra, proporções humanas, 16 fases de corrida e oito direções.';};
for(const button of document.querySelectorAll('[data-pass]'))button.onclick=()=>{const {B,m,a}=setup(),p=m.teams[0].players[9],q=m.teams[0].players[10],moving=button.dataset.pass==='moving',distance=moving?200:+button.dataset.pass;m.players.forEach(r=>{r.red=r!==p&&r!==q;});Object.assign(p,{x:B.FIELD.cx-130,y:B.FIELD.cy,px:B.FIELD.cx-130,py:B.FIELD.cy,vx:0,vy:0,facing:{x:1,y:0}});Object.assign(q,{x:p.x+distance,y:p.y,vx:moving?90:0,vy:moving?20:0});m.ball.reset(p.x+10,p.y);m.ball.owner=p;m.controlled=p;m.pass(p,'pass',.55,{x:1,y:0},q);state.receiver=q;state.speed=Math.hypot(m.ball.vx,m.ball.vy);a.renderer.camera.x=B.FIELD.cx;a.renderer.camera.y=B.FIELD.cy;status.textContent='Passe disparado a '+state.speed.toFixed(0)+' u/s. Avance para acompanhar a recepção.';};
document.getElementById('step').onclick=()=>{if(!state)return;const {m}=state;for(let i=0;i<12;i++){m.update(1/120,{axis:{x:0,y:0},state:{},pressed:{},released:{}});state.time+=1/120;}status.textContent='Tempo '+state.time.toFixed(2)+' s · '+(m.ball.owner===state.receiver?'PASSE RECEBIDO':'bola em jogo')+' · velocidade '+Math.hypot(m.ball.vx,m.ball.vy).toFixed(0)+' u/s';};
document.getElementById('corner').onclick=()=>{const {B,m}=setup();m.setRestart('ESCANTEIO',0,B.FIELD.w-6,6);status.textContent='Escanteio: câmera da cobrança. Clique Cobrar para voltar à câmera normal no toque na bola.';};
document.getElementById('free').onclick=()=>{const {B,m}=setup();m.setRestart('FALTA',0,B.FIELD.w-300,B.FIELD.cy+70);status.textContent='Falta: '+m.freeKick.boxAttackers.length+' atacantes na área, opção curta e rebote. Chute direto ou cruzamento.';};
document.getElementById('launch').onclick=()=>{if(!state?.m.freeKick)return;state.m.freeKick.launch(state.m);status.textContent=state.m.freeKick.corner?'Bola cobrada · câmera normal da partida.':'Falta cobrada · bola em jogo.';};
document.getElementById('cross').onclick=()=>{if(!state?.m.freeKick)return;state.m.freeKick.deliveryMode='cross';state.m.freeKick.launch(state.m);status.textContent='Falta cruzada para os atacantes na área · câmera normal da partida.';};
</script></html>
