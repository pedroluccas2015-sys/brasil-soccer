<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Atletas — revisão do vídeo</title><style>*{box-sizing:border-box}body{margin:0;background:#12242a;color:#efeacf;font:14px Arial}header{padding:18px 24px;border-bottom:2px solid #c3ab5d}h1{margin:0 0 7px;font-size:23px}p{margin:0;color:#b6c8b8}nav{display:flex;flex-wrap:wrap;gap:10px;padding:14px 24px;align-items:center}button,select{background:#26474b;border:1px solid #6f9590;color:inherit;padding:8px;cursor:pointer}label{display:flex;gap:6px;align-items:center}output{display:block;padding:0 24px 14px;color:#d8d995}canvas{width:calc(100% - 48px);margin:0 24px 18px;display:block;image-rendering:pixelated;border:1px solid #608866}iframe{position:absolute;top:0;left:-3000px;width:1280px;height:720px;border:0}</style><header><h1>Atletas e arbitragem · revisão dos sprites</h1><p>Rostos arredondados, tronco curto e membros articulados em todas as poses.</p></header><nav><button id="play">Animar / pausar</button><button id="step">Próximo quadro</button><label>Direção <select id="direction"><option value="0">Direita</option><option value="1">Diagonal direita</option><option value="2">Frente</option><option value="3">Diagonal esquerda</option><option value="4">Esquerda</option><option value="5">Costas esquerda</option><option value="6">Costas</option><option value="7">Costas direita</option></select></label><label>Modelo <select id="role"><option value="FW">Atleta</option><option value="GK">Goleiro</option><option value="RF">Árbitro</option></select></label><button id="directions">Oito direções</button><button id="poses">Todas as poses</button></nav><output id="status">Carregando os modelos…</output><canvas id="atlas" width="1000" height="710" aria-label="Todas as poses dos atletas e árbitros redesenhados"></canvas><iframe id="frame" src="../index.html" title="Motor do jogo"></iframe><script>
const frame=document.getElementById('frame'),canvas=document.getElementById('atlas'),g=canvas.getContext('2d'),status=document.getElementById('status');let state,time=.32,animate=false,mode='poses';const poses=['idle','run','sprint','receive','pass','long','kick','setpiece','header','volley','bicycle','slide','fall','dive','catch','hold','throwin','celebrate','tackle','whistle','watch','point','flag','dribble','placed'];const labels=['Parado','Corrida','Arrancada','Domínio','Passe','Cruzamento','Chute','Cobrança','Cabeceio','Voleio','Bicicleta','Carrinho','Queda','Mergulho','Encaixe','Bola nas mãos','Lateral','Comemoração','Desarme','Apito','Relógio','Indicação','Bandeira','Drible','Chute colocado'];const durations={slide:.6,fall:.7,dive:.6,receive:.16,tackle:.22,catch:.45,long:.38,setpiece:.46,throwin:.64,header:.52,volley:.58,bicycle:.72};
frame.onload=()=>{const ready=()=>{const B=frame.contentWindow.BSS;if(!B?.app){setTimeout(ready,100);return;}const a=B.app;a.start('flamengo','palmeiras',{human:0,cutscenes:false});a.paused=true;state={B,a,m:a.match};draw();};ready();};
function actor(kind,dir,t){const {m}=state,role=document.getElementById('role').value,p={...m.teams[0].players[role==='GK'?0:9],anim:kind,animTime:(durations[kind]||.42)*(1-t),runTime:t*12,facing:{x:Math.cos(dir*Math.PI/4),y:Math.sin(dir*Math.PI/4)}};if(role==='RF'){p.id='official';p.role='RF';p.team={kit:{shirtBaseColor:'#f3cc46',shirtSecondaryColor:'#273628',shortsColor:'#253036',socksColor:'#253036',pattern:'SOLID'}};}return p;}
function figure(p,x,y,scale){const r=state.a.renderer,sp=r.sprite(p);g.fillStyle='#164d36';g.beginPath();g.ellipse(x,y,14*scale/2.4,3*scale/2.4,0,0,Math.PI*2);g.fill();g.drawImage(sp,Math.round(x-sp.anchorX*scale),Math.round(y-sp.anchorY*scale),Math.round(sp.width*scale),Math.round(sp.height*scale));}
function draw(){if(!state)return;const dir=+document.getElementById('direction').value,t=time%1;g.imageSmoothingEnabled=false;g.fillStyle='#1d3a3c';g.fillRect(0,0,1000,710);g.textAlign='center';g.font='bold 13px monospace';
if(mode==='poses'){poses.forEach((pose,i)=>{const col=i%7,row=Math.floor(i/7),x=71+col*143,y=40+row*173;g.fillStyle=i%2?'#36774d':'#317148';g.fillRect(col*143,row*173,142,172);g.fillStyle='#f4e7bb';g.fillText(labels[i],x,y-19);figure(actor(pose,dir,t),x,y+104,2.3);});status.textContent='25 poses · direção '+dir+' · quadro '+Math.floor(t*12)+'/11 · '+document.getElementById('role').selectedOptions[0].text;}else{for(let d=0;d<8;d++){const col=d%4,row=Math.floor(d/4),x=125+col*250,y=65+row*340;g.fillStyle=d%2?'#36774d':'#317148';g.fillRect(col*250,row*340,249,339);g.fillStyle='#f4e7bb';g.fillText('Direção '+d,x,y-20);figure(actor('run',d,t),x,y+175,4);figure(actor('idle',d,t),x,y+260,1.5);}status.textContent='Oito direções compartilham o mesmo modelo e as mesmas proporções.';}}
document.getElementById('play').onclick=()=>animate=!animate;document.getElementById('step').onclick=()=>{time=(time+1/12)%1;draw();};document.getElementById('direction').onchange=draw;document.getElementById('role').onchange=draw;document.getElementById('directions').onclick=()=>{mode='directions';draw();};document.getElementById('poses').onclick=()=>{mode='poses';draw();};function loop(){if(animate){time+=.01;draw();}requestAnimationFrame(loop);}requestAnimationFrame(loop);
</script></html>
