<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Câmeras, chutes e goleiro — validação</title><style>body{margin:0;background:#0b1724;color:#edf3d6;font:14px Arial}nav{display:flex;gap:6px;padding:10px;flex-wrap:wrap}button{padding:9px;background:#213c50;color:inherit;border:1px solid #89a4a0;cursor:pointer}output{display:block;padding:8px 12px;color:#cbf37a}iframe{display:block;width:100%;height:calc(100dvh - 150px);border:0}</style><nav><button id="pk">Pênalti</button><button data-fk="0">Falta central</button><button data-fk="1">Falta lateral</button><button data-corner="0">Escanteio esquerdo</button><button data-corner="1">Escanteio direito</button><button id="side">Trocar lado</button><button id="shot">Iniciar chute</button><button id="step">Avançar 0,05 s</button><button id="contact">Contato com a bola</button><button id="keeper">Goleiro encaixado</button><button id="approach">Tentar aproximar</button><button id="release">Repor</button></nav><output id="status">Carregando…</output><iframe id="frame" src="../index.html" title="Jogo em validação"></iframe><script>
const frame=document.getElementById('frame'),status=document.getElementById('status');let state,side=0,lastScene='fk0';frame.onload=()=>status.textContent='Pronto. Escolha um cenário.';
function setup(mode='quick'){const B=frame.contentWindow.BSS,a=B.app;a.start('flamengo','palmeiras',{mode,human:side,cutscenes:false,seed:77});a.paused=true;a.match.bannerTime=0;return state={B,a,m:a.match};}
function scene(type){lastScene=type;const {B,m}=setup(type==='pk'?'penalties':'quick'),t=m.teams[side],gx=t.dir>0?B.FIELD.w:0;if(type==='pk'){if(side)m.setupPenalty(side,true);status.textContent='Pênalti com os mesmos sprites de campo. Inicie o chute e avance para ver preparação, contato e finalização.';return;}const corner=type.startsWith('corner');m.setRestart(corner?'ESCANTEIO':'FALTA',side,gx-t.dir*(corner?6:300),corner?(type.endsWith('1')?B.FIELD.h-6:6):B.FIELD.cy+(type.endsWith('1')?230:0));status.textContent=(corner?'Escanteio':'Falta')+' · gol centralizado, linha horizontal, áreas e arcos no mesmo campo.';}
document.getElementById('pk').onclick=()=>scene('pk');for(const b of document.querySelectorAll('[data-fk]'))b.onclick=()=>scene('fk'+b.dataset.fk);for(const b of document.querySelectorAll('[data-corner]'))b.onclick=()=>scene('corner'+b.dataset.corner);document.getElementById('side').onclick=()=>{side=1-side;scene(lastScene);};
document.getElementById('shot').onclick=()=>{if(!state)return;const {m}=state;if(m.penalty)m.kickPenalty(.6);else if(m.freeKick){m.freeKick.phase='runup';m.freeKick.time=0;}status.textContent='Corrida e preparação do chute iniciadas. Avance a animação.';};
function step(count=6){if(!state)return;const {m}=state;for(let i=0;i<count;i++)m.update(1/120,{axis:{x:0,y:0},state:{},pressed:{},released:{}});const p=m.penalty?.taker||m.freeKick?.taker;status.textContent=(m.penalty?.phase||m.freeKick?.phase||m.state)+' · '+(p?.anim||'jogo normal')+' · bola '+Math.hypot(m.ball.vx,m.ball.vy).toFixed(0)+' u/s';}
document.getElementById('step').onclick=()=>step();document.getElementById('contact').onclick=()=>{if(!state)return;for(let i=0;i<100;i++){if(state.m.penalty?.phase==='flight'||state.m.freeKick?.phase==='flight')break;step(1);}status.textContent+=' · bola saiu do pé';};
document.getElementById('keeper').onclick=()=>{const {B,a,m}=setup(),g=m.teams[1-side].players[0],p=m.teams[side].players[9];m.state='play';g.x=g.team.dir>0?25:B.FIELD.w-25;g.y=B.FIELD.cy;g.heldTime=0;m.ball.reset(g.x,g.y);m.ball.owner=g;m.ball.lastTouch=g;p.x=g.x+g.team.dir*70;p.y=g.y;m.controlled=p;m.protectKeeper();state.g=g;state.p=p;a.renderer.camera.x=g.x;a.renderer.camera.y=g.y;status.textContent='Bola nas mãos do goleiro. Tente aproximar ou reponha para liberar o espaço.';};
document.getElementById('approach').onclick=()=>{if(!state?.g)return;const {m,g,p}=state;for(let i=0;i<40;i++)m.update(1/120,{axis:{x:-g.team.dir,y:0},state:{sprint:true},pressed:{shoot:true,context:true},released:{}});status.textContent='Distância ao goleiro: '+Math.hypot(p.x-g.x,p.y-g.y).toFixed(1)+' u · posse '+(m.ball.owner===g?'preservada':'liberada');};
document.getElementById('release').onclick=()=>{if(!state?.g)return;const {m,g}=state;m.pass(g,'pass',.6,{x:g.team.dir,y:0});status.textContent='Reposição feita · proteção encerrada, bola disputável.';};
</script></html>
