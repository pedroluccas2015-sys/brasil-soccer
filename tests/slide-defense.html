<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Carrinho e defesa — verificação visual</title>
<style>body{margin:0;background:#0b1724;color:#edf3d6;font:14px Arial}nav{display:flex;gap:8px;padding:12px;flex-wrap:wrap}button{padding:10px;background:#213c50;color:inherit;border:1px solid #89a4a0;cursor:pointer}iframe{display:block;width:100%;height:calc(100dvh - 115px);border:0}output{display:block;padding:8px 12px;color:#cbf37a}#atlas{display:none;margin:12px auto;width:min(100%,1000px);image-rendering:pixelated}body.atlas iframe{display:none}body.atlas #atlas{display:block}</style>
<nav aria-label="Cenários de validação"><button id="poses">Carrinho: 8 direções</button><button id="slide">Carrinho no campo</button><button id="step">Avançar 0,05 s</button><button data-defend="0">Defesa mandante</button><button data-defend="1">Defesa visitante</button><button id="press">Segundo defensor</button></nav><output id="status">Carregando…</output><canvas id="atlas" width="1000" height="460"></canvas><iframe id="game-frame" src="../index.html" title="Jogo em validação"></iframe>
<script>
const frame=document.getElementById('game-frame'),status=document.getElementById('status');let state;
frame.onload=()=>status.textContent='Pronto. Selecione um cenário.';
function setup(){const B=frame.contentWindow.BSS,a=B.app;a.start('flamengo','palmeiras',{mode:'quick',seed:17,cutscenes:false});a.paused=true;a.match.state='play';a.debug=false;document.body.classList.remove('atlas');return {B,a,m:a.match};}
document.getElementById('poses').onclick=()=>{const {B,a,m}=setup(),canvas=document.getElementById('atlas'),g=canvas.getContext('2d'),p=m.controlled;document.body.classList.add('atlas');g.imageSmoothingEnabled=false;g.fillStyle='#183c30';g.fillRect(0,0,1000,460);const labels=['→','↘','↓','↙','←','↖','↑','↗'];
 for(let i=0;i<8;i++){const x=(i%4)*250,y=Math.floor(i/4)*230;g.fillStyle='#eef2c9';g.font='bold 18px Arial';g.fillText('DIREÇÃO '+labels[i],x+18,y+30);g.font='12px Arial';g.fillText('entrada     deslize      levantar',x+12,y+54);
  for(let j=0;j<3;j++){const progress=[.10,.40,.89][j],sprite=a.renderer.sprite({...p,anim:'slide',animTime:(1-progress)*B.SLIDE.duration,slideDirection:{x:Math.cos(i*Math.PI/4),y:Math.sin(i*Math.PI/4)}});g.drawImage(sprite,x+6+j*80,y+75,80,72);}
 }status.textContent='Oito direções · entrada, pé estendido à frente e recuperação. Pose renderizada pelo jogo.';
};
document.getElementById('slide').onclick=()=>{state=setup();const {B,m,a}=state,p=m.controlled;p.x=B.FIELD.cx-80;p.y=B.FIELD.cy;p.px=p.x;p.py=p.y;p.vx=125;p.vy=0;p.facing={x:1,y:0};m.ball.reset(B.FIELD.cx+130,B.FIELD.cy+90);m.players.filter(q=>q!==p).forEach((q,i)=>{q.x=60+i*62;q.y=150;});m.tackle(p,true);a.renderer.camera.x=p.x+50;a.renderer.camera.y=p.y;status.textContent='Carrinho iniciado. Avance para acompanhar o deslize, a grama e a recuperação.';};
document.getElementById('step').onclick=()=>{if(!state)return;const {m}=state,input={axis:{x:-1,y:0},state:{},pressed:{},released:{}};for(let i=0;i<6;i++)m.update(1/120,input);status.textContent='Fase '+m.controlled.anim+' · '+m.controlled.animTime.toFixed(2)+' s · grama: '+m.turf.length+' partículas';};
for(const button of document.querySelectorAll('[data-defend]'))button.onclick=()=>{state=setup();const {B,m,a}=state,side=+button.dataset.defend;m.human=side;m.controlled=m.teams[side].players[9];const t=m.teams[side],carrier=m.teams[1-side].players[9];carrier.x=t.dir>0?330:B.FIELD.w-330;carrier.y=200;carrier.decision=999;m.ball.reset(carrier.x,carrier.y);m.ball.owner=carrier;m.controlled.x=carrier.x-t.dir*140;m.controlled.y=carrier.y+80;
 const move=m.ai.moveTo.bind(m.ai);m.ai.moveTo=(p,x,y,sprint,dt)=>{p.defenseTarget={x,y};move(p,x,y,sprint,dt);};for(let i=0;i<150;i++)m.ai.update(1/60);a.debug=true;a.renderer.camera.x=carrier.x;a.renderer.camera.y=B.FIELD.cy;status.textContent='Defesa '+(side?'visitante':'mandante')+' · pressão, cobertura e corredores de marcação. F2 mostra estados.';};
document.getElementById('press').onclick=()=>{if(!state)return;const {m}=state;m.secondPress=true;m.ai.update(1/60);status.textContent='Segundo defensor solicitado · '+m.teams[m.human].players.filter(p=>p.state==='SECOND_PRESS').length+' jogador auxiliando a pressão.';};
</script></html>
